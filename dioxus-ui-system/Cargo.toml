[package]
name = "dioxus-ui-system"
version = "0.0.7"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "A pure Rust design system for Dioxus with Atomic Design principles"
readme = "README.md"

[dependencies]
dioxus = { version = "0.6", default-features = false, features = ["signals", "macro", "hooks", "html"] }
dioxus-router = { version = "0.6", optional = true }
serde = { version = "1.0", features = ["derive"] }
web-sys = { version = "0.3", features = ["Storage", "Window", "Document", "Element", "HtmlInputElement", "FileList", "File", "Blob", "Url"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }

[features]
default = ["web"]
web = ["dioxus/web", "dep:web-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
router = ["dep:dioxus-router"]

[lib]
name = "dioxus_ui_system"
path = "src/lib.rs"
