name: CI

on:
  push:
    branches: [main, master, "release/**"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install  # version/components from rust-toolchain.toml
      - run: cargo fmt --all --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install  # version/components from rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      # The desktop/mobile examples link against GTK/WebKit on Linux.
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install  # version/components from rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      # Library only: the example apps need platform webview SDKs.
      - run: cargo test -p dioxus-ui-system

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install  # version/components from rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p dioxus-ui-system --target wasm32-unknown-unknown
      - run: cargo check -p dioxus-ui-docs --target wasm32-unknown-unknown

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install  # version/components from rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish -p dioxus-ui-system --dry-run
