[workspace]
members = [
    "dioxus-ui-system",
    "examples/shared",
    "examples/web-csr",
    "examples/web-ssr",
    "examples/desktop",
    "examples/mobile",
    "docs-app",
]
resolver = "2"

[workspace.package]
version = "0.0.7"
edition = "2021"
authors = ["Esteban Puello <eftech93@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/eftech93/rust-ds"
homepage = "https://github.com/eftech93/rust-ds"
documentation = "https://docs.rs/dioxus-ui-system"
keywords = ["dioxus", "rust", "design-system", "ui-components", "atomic-design"]
categories = ["gui", "web-programming", "wasm"]
rust-version = "1.80"

[workspace.dependencies]
dioxus = { version = "0.7", features = ["router"] }
serde = { version = "1.0", features = ["derive"] }
web-sys = { version = "0.3", features = [
    "Storage",
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "FileList",
    "File",
    "Blob",
    "Url",
    "Location",
    "History",
    "ScrollToOptions",
    "Navigator",
    "Clipboard",
] }

# Profile for release builds - strip debug info to avoid wasm-opt DWARF issues
[profile.release]
# Strip debug symbols to prevent wasm-opt DWARF errors
strip = "debuginfo"
# Or use strip = "symbols" for even smaller builds
lto = true
opt-level = "z"

# Profile for WASM builds specifically
[profile.wasm-release]
inherits = "release"
strip = "symbols"
opt-level = "z"
lto = true
